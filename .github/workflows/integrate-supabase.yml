name: Integrar Supabase no catalogo MUV

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conectar Admin e loja ao Supabase
        shell: python
        run: |
          from pathlib import Path
          for name in ['admin.html', 'index.html']:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              tag1 = '<script src="/supabase-config.js"></script>'
              tag2 = '<script src="/supabase-products.js"></script>'
              if tag1 not in text or tag2 not in text:
                  text = text.replace('</body>', tag1 + '\n' + tag2 + '\n</body>', 1)
                  p.write_text(text, encoding='utf-8')

      - name: Commit alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html index.html supabase-products.js supabase_migration.sql supabase-config.js
          git diff --cached --quiet || git commit -m "Conectar catalogo MUV ao Supabase"
          git push
